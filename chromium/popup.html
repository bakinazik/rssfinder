<!doctype html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>RSS Finder</title>
        <style>
            :root {
                --bg: #ffffff;
                --card: #eeeeee;
                --text: #111111;

                --muted: #5f6368;
                --border: #e8eaed;
                --hover: #f1f3f4;

                --primary: #faa501;
                --primary-hover: #fb9400;

                --success: #34a853;

                --button-border: #dadce0;
                --button-text: #3c4043;

                --empty-icon: #dadce0;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #222222;
                    --text: #e8eaed;
                    --card: #333333;
                    --muted: #9aa0a6;
                    --border: #444444;
                    --hover: #444444;

                    --primary: #faa501;
                    --primary-hover: #fb9400;

                    --button-border: #5f6368;
                    --button-text: #e8eaed;

                    --empty-icon: #3c4043;
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
                text-decoration: none;
            }

            [hidden] {
                display: none !important;
            }

            a {
                color: var(--primary);
            }

            a:hover {
                text-decoration: underline;
            }

            body {
                font-family: sans-serif;
                width: 360px;
                padding: 16px;
                background: var(--bg);
                color: var(--text);
                min-height: 250px;
                font-size: 13px;
            }

            .header {
                display: flex;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 16px;
            }

            .header-actions {
                display: flex;
                gap: 8px;
            }

            #status {
                font-weight: 500;
                color: var(--muted);
            }

            .btn {
                background: none;
                border: 1px solid var(--border);
                border-radius: 7px;
                padding: 7px 15px;
                font-size: 12px;
                cursor: pointer;
                color: var(--button-text);
                transition: background 0.2s;
            }

            .btn:hover:not(:disabled) {
                background: var(--hover);
            }

            .btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            .btn.primary {
                background: var(--primary);
                border-color: var(--primary);
                color: #111111;
                font-weight: 600;
            }

            .btn.primary:hover:not(:disabled) {
                background: var(--primary-hover);
                border-color: var(--primary-hover);
            }

            #progressContainer {
                height: 2px;
                background: var(--border);
                margin-bottom: 16px;
                border-radius: 1px;
                overflow: hidden;
                position: absolute;
                left: 0;
                top: 0;
                right: 0;
            }

            #progressBar {
                width: 0%;
                height: 100%;
                background: var(--primary);
                transition: width 0.2s ease;
            }

            #progressContainer:has(#progressBar[style*="width: 100%"]) {
                display: none;
            }

            #card {
                display: flex;
                flex-direction: column;
                height: 250px;
                background: var(--card);
                border-radius: 10px;
                overflow: hidden;
            }

            ul {
                flex: 1;
                min-height: 0;
                list-style: none;
                overflow-y: auto;
            }

            ul::-webkit-scrollbar {
                width: 6px;
            }

            ul::-webkit-scrollbar-track {
                background: var(--border);
                border-radius: 3px;
            }

            ul::-webkit-scrollbar-thumb {
                background: var(--muted);
                border-radius: 3px;
            }

            ul::-webkit-scrollbar-thumb:hover {
                background: var(--primary);
            }

            li,
            .select-all {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 8px;
                border-bottom: 1px solid var(--border);
                transition: background 0.2s;
            }

            li:last-child {
                border-bottom: none;
            }

            li:hover,
            .select-all:hover {
                background: var(--hover);
            }

            .select-all {
                flex-shrink: 0;
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
            }

            #selectedCount {
                margin-left: auto;
                padding-right: 4px;
                color: var(--muted);
            }

            input[type='checkbox'] {
                width: 15px;
                height: 15px;
                accent-color: var(--primary);
                cursor: pointer;
                flex-shrink: 0;
            }

            .feed-check {
                display: none;
            }

            .feed-dot {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 15px;
                height: 15px;
                flex-shrink: 0;
            }

            .feed-dot::after {
                content: '';
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--primary);
            }

            .select-mode li {
                cursor: pointer;
                user-select: none;
            }

            .select-mode .feed-check {
                display: block;
            }

            .select-mode .feed-dot,
            .select-mode .copy-button {
                display: none;
            }

            .select-mode .feed-url {
                pointer-events: none;
            }

            .feed-content {
                flex: 1;
                min-width: 0;
            }

            .feed-title {
                font-size: 12px;
                font-weight: 500;
                color: var(--text);
                margin-bottom: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            .feed-url {
                font-size: 11px;
                color: var(--muted);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                display: block;
            }

            .feed-url:hover {
                text-decoration: underline;
                color: var(--primary-hover);
            }

            .copy-button {
                border-radius: 10px;
                width: 35px;
                height: 30px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                color: var(--muted);
                transition: all 0.2s;
                flex-shrink: 0;
                background: var(--bg);
                border: none;
            }

            .copy-button:hover {
                color: var(--primary);
            }

            .copy-button.copied {
                background: var(--primary);
                border-color: var(--primary);
                color: var(--bg);
            }

            .icon {
                width: 16px;
                height: 16px;
            }

            #emptyState {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                color: var(--muted);
                font-size: 13px;
            }

            .empty-icon {
                width: 48px;
                height: 48px;
                color: var(--muted);
            }

            .actions {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                gap: 8px;
                margin-top: 12px;
            }

            .icon-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                height: 34px;
                padding: 0;
            }

            .btn.active {
                color: var(--primary);
            }

            @keyframes spin {
                from { transform: rotate(0deg); }
                to   { transform: rotate(360deg); }
            }

            .spinning {
                animation: spin 1s linear infinite;
                color: var(--primary);
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div id="status" data-i18n="statusScanning"></div>
            <div class="header-actions">
                <button id="refreshButton" class="btn" data-i18n="buttonRefresh"></button>
            </div>
        </div>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>

        <div id="card">
            <label id="selectAllRow" class="select-all" hidden>
                <input id="selectAll" type="checkbox" />
                <span data-i18n="selectAll"></span>
                <span id="selectedCount"></span>
            </label>

            <ul id="rssLinks" hidden></ul>

            <div id="emptyState">
                <svg id="spinnerIcon" class="empty-icon spinning" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <circle cx="12" cy="12" r="10" stroke-width="2" stroke-dasharray="40 20" stroke-linecap="round" />
                </svg>
                <svg id="rssIcon" class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" style="display: none">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M5 19m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0M4 4a16 16 0 0 1 16 16M4 11a9 9 0 0 1 9 9" />
                </svg>
            </div>
        </div>

        <div id="actions" class="actions">
            <button id="selectToggle" class="btn icon-btn"></button>
            <button id="copyAll" class="btn icon-btn"></button>
            <button id="exportOpml" class="btn icon-btn primary"></button>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
